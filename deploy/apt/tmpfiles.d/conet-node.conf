# The signer keystore directory must exist, owned by the signer, before the first import.
d /var/lib/conet-signer 0700 conet-signer conet-signer -
d /etc/conet-node 0755 root root -
# The encrypted KEK credential lives here (systemd's standard credstore); root only.
d /etc/credstore.encrypted 0700 root root -
