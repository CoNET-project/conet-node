# conet-node APT package: two service accounts, fixed ids so the signer can pin the peer uid.
# 61050 and 61051 were checked free on every pilot node (getent, 2026-11-27).
u conet-signer 61050 "CoNET node signer" /var/lib/conet-signer /usr/sbin/nologin
u conet-node 61051 "CoNET node" /var/lib/conet-node /usr/sbin/nologin
