<!doctype html>
<meta charset="utf-8">
<title>conet-node WebRTC entry test</title>
<style>body{font:14px/1.5 system-ui;margin:2em}pre{background:#f4f4f4;padding:1em}</style>
<h1>conet-node WebRTC entry test</h1>
<p>Dials the node from its signed endpoint statement, without HTTPS and without signalling.</p>
<pre id="out">running…</pre>
<script>
// Must stay identical to si_proto::webrtc::{answer_sdp, munge_offer, MAX_MESSAGE}.
const MAX_MESSAGE = 16 * 1024;
const q = new URLSearchParams(location.search);
const NODE = q.get('node');          // e.g. http://127.0.0.1:18080 (statement only)
const REPORT = q.get('report') || ''; // harness URL that collects results
const out = document.getElementById('out');
const t0 = performance.now();
const steps = [];
const step = (s) => { steps.push(`${Math.round(performance.now() - t0)}ms ${s}`); out.textContent = steps.join('\n'); };

function rand32() {
  const a = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  const b = crypto.getRandomValues(new Uint8Array(32));
  return Array.from(b, (x) => a[x % a.length]).join('');
}
function munge(sdp, ufrag) {
  return sdp.split('\r\n').map((l) =>
    l.startsWith('a=ice-ufrag:') ? `a=ice-ufrag:${ufrag}` :
    l.startsWith('a=ice-pwd:') ? `a=ice-pwd:${ufrag}` : l).join('\r\n');
}
function answer(ip, port, ufrag, fp) {
  return [
    'v=0', `o=- 0 0 IN IP4 ${ip}`, 's=-', 't=0 0', 'a=group:BUNDLE 0', 'a=ice-lite',
    `m=application ${port} UDP/DTLS/SCTP webrtc-datachannel`, `c=IN IP4 ${ip}`, 'a=mid:0',
    `a=ice-ufrag:${ufrag}`, `a=ice-pwd:${ufrag}`, `a=fingerprint:${fp}`, 'a=setup:passive',
    'a=sctp-port:5000', `a=max-message-size:${MAX_MESSAGE}`,
    `a=candidate:1467250027 1 UDP 1467250027 ${ip} ${port} typ host`, 'a=end-of-candidates', '',
  ].join('\r\n');
}

// One HTTP request per data channel; the node closes the channel after the response.
function request(pc, dc, text, ms = 15000) {
  return new Promise((resolve, reject) => {
    dc = dc || pc.createDataChannel('post');
    dc.binaryType = 'arraybuffer';
    const parts = [];
    const timer = setTimeout(() => reject(new Error('timeout')), ms);
    const bytes = new TextEncoder().encode(text);
    let off = 0;
    const pump = () => {
      while (off < bytes.length && dc.bufferedAmount < 8 * MAX_MESSAGE) {
        dc.send(bytes.subarray(off, off + MAX_MESSAGE));
        off += MAX_MESSAGE;
      }
    };
    dc.bufferedAmountLowThreshold = 2 * MAX_MESSAGE;
    dc.onbufferedamountlow = pump;
    dc.onopen = pump;
    if (dc.readyState === 'open') pump();
    const t = performance.now();
    dc.onmessage = (e) => {
      if (!parts.length) request.firstByteMs = Math.round(performance.now() - t);
      parts.push(new Uint8Array(e.data));
    };
    dc.onclose = () => {
      clearTimeout(timer);
      const all = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
      let i = 0; for (const p of parts) { all.set(p, i); i += p.length; }
      resolve(new TextDecoder().decode(all));
    };
  });
}

async function report(ok, error) {
  const body = JSON.stringify({ ok, error: error || null, ua: navigator.userAgent, steps });
  if (REPORT) { try { await fetch(REPORT, { method: 'POST', body }); } catch (_) {} }
}

(async () => {
  try {
    const st = await (await fetch(`${NODE}/webrtc`)).json();
    step(`statement ${st.ip}:${st.port} wallet ${st.wallet.slice(0, 10)}…`);
    const ufrag = 'conet1' + rand32();
    const pc = new RTCPeerConnection();
    pc.oniceconnectionstatechange = () => step(`ice ${pc.iceConnectionState}`);
    const first = pc.createDataChannel('post');
    const offer = await pc.createOffer();
    await pc.setLocalDescription({ type: 'offer', sdp: munge(offer.sdp, ufrag) });
    await pc.setRemoteDescription({ type: 'answer', sdp: answer(st.ip, st.port, ufrag, st.fingerprint) });
    step('sdp set (munged offer, local answer)');

    const r1 = await request(pc, first, 'OPTIONS /post HTTP/1.1\r\nHost: t\r\n\r\n');
    step(`OPTIONS -> ${r1.split('\r\n')[0]}`);
    if (!r1.startsWith('HTTP/1.1 204')) throw new Error('OPTIONS answer');

    const body = JSON.stringify({ data: 'not an armor' });
    const r2 = await request(pc, null, `POST /post HTTP/1.1\r\nHost: t\r\nContent-Type: application/json\r\nContent-Length: ${body.length}\r\n\r\n${body}`);
    step(`POST /post -> ${r2.split('\r\n')[0] || '(closed without answer)'} (first byte ${request.firstByteMs} ms)`);

    const bigBody = JSON.stringify({ data: 'x'.repeat(200 * 1024) });
    const r3 = await request(pc, null, `POST /post HTTP/1.1\r\nHost: t\r\nContent-Type: application/json\r\nContent-Length: ${bigBody.length}\r\n\r\n${bigBody}`);
    step(`POST 200 KB -> ${r3.split('\r\n')[0] || '(closed without answer)'}`);

    const parallel = await Promise.all([1, 2, 3, 4].map(() => request(pc, null, 'OPTIONS /post HTTP/1.1\r\nHost: t\r\n\r\n')));
    step(`4 parallel channels -> ${parallel.map((r) => r.split(' ')[1]).join(',')}`);
    pc.close();
    step('done');
    await report(true);
  } catch (e) {
    step(`FAILED: ${e && e.message}`);
    await report(false, String(e && e.message));
  }
})();
</script>
