[package]
name = "conet-node"
description = "CoNET Linux node: entry, forwarding, mailbox"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
si-proto.workspace = true
si-crypto.workspace = true
si-core.workspace = true
si-signer.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
httparse = "1"
httpdate = "1"
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
alloy-sol-types = "1"
alloy-primitives = "1"
redb = "4"
hex.workspace = true
base64.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
pgp = { workspace = true }
tempfile = "3"
zeroize = "1"
rand_chacha.workspace = true
rand_core.workspace = true
base64.workspace = true
