[package]
name = "conet-node"
description = "CoNET Linux node: entry, forwarding, mailbox"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
si-proto.workspace = true
si-crypto.workspace = true
si-core.workspace = true
si-signer.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
httparse = "1"
httpdate = "1"
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
alloy-sol-types = "1"
alloy-primitives = "1"
redb = "4"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rustls-acme = { version = "0.15", features = ["tokio"] }
instant-acme = { version = "0.8", default-features = false, features = ["aws-lc-rs", "hyper-rustls", "rcgen"] }
x509-parser = "0.18"
futures-util = "0.3"
hickory-resolver = "0.26"
if-addrs = "0.15"
str0m = { version = "0.25", default-features = false, features = ["aws-lc-rs"] }
hex.workspace = true
base64.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
pgp = { workspace = true }
tempfile = "3"
str0m = { version = "0.25", default-features = false, features = ["aws-lc-rs"] }
zeroize = "1"
rand_chacha.workspace = true
rand_core.workspace = true
base64.workspace = true
